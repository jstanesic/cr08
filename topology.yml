name: cr08

hosts:
  - name: dc01
    flavor: c2_r4_d40
    base_box:
      image: windows-server-2019-x86_64
      mgmt_user: Administrator
      mgmt_protocol: winrm
    hidden: false

  - name: client
    base_box:
      image: windows-server-2019-x86_64
      man_user: ubuntu
    flavor: standard.small

routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: standard.small

networks:
  - name: server-switch
    cidr: 192.168.20.0/24
    accessible_by_user: False

  - name: client-switch
    cidr: 192.168.30.0/24

net_mappings:
  - host: dc01
    network: server-switch
    ip: 192.168.20.5
  - host: client
    network: client-switch
    ip: 192.168.30.5

router_mappings:
  - router: router
    network: server-switch
    ip: 192.168.20.1
  - router: router
    network: client-switch
    ip: 192.168.30.1

groups: []