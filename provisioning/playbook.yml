- name: Wait until WinRM/PSRP is reachable on every Windows host
  hosts: windows_hosts
  gather_facts: false
  tasks:
    - name: Wait for PSRP listener to accept connections
      ansible.builtin.wait_for_connection:
        delay: 0
        sleep: 10
        timeout: 900
- name: Active Directory — promote domain controller
  hosts: domain-controllers
  gather_facts: false
  vars:
    ad_domain_name: globalfinancial.local
    ad_admin_password: Pa$$w0rd
  roles:
    - name: ansible-role-user-access-windows
      user_access_username: localadmin
      user_access_password: Password123!
      user_access_rdp: True
      user_access_admin: True
  tasks:
    - name: Ensure AD DS Windows feature is installed
      register: ad_feature
      ansible.windows.win_feature:
        name: AD-Domain-Services
        include_management_tools: true
        state: present
    - name: Detect whether host is already promoted to a domain controller
      register: dc_role
      changed_when: false
      ansible.windows.win_shell: >-
        (Get-CimInstance Win32_ComputerSystem).DomainRole
    - name: Set a strong password on the built-in Administrator account
      when: (dc_role.stdout | trim | int) < 4
      ansible.windows.win_user:
        name: Administrator
        password: '{{ ad_admin_password }}'
        password_never_expires: true
        state: present
    - name: Promote host to domain controller
      when: ad_feature is succeeded
      microsoft.ad.domain:
        dns_domain_name: '{{ ad_domain_name }}'
        safe_mode_password: '{{ ad_admin_password }}'
        reboot: true
    - name: Wait for AD DS to come up after the post-promotion reboot
      ansible.windows.win_wait_for:
        host: 127.0.0.1
        port: 389
        delay: 30
        timeout: 600
    - name: Ensure default OU for trainees exists
      microsoft.ad.ou:
        name: Trainees
        path: DC={{ ad_domain_name.split(".") | join(",DC=") }}
        state: present
    - name: Create the domain account students use to administer the domain
      microsoft.ad.user:
        name: domainuser
        sam_account_name: domainuser
        upn: domainuser@{{ ad_domain_name }}
        password: Password123!
        password_never_expires: true
        enabled: true
        state: present
        groups:
          add:
            - Domain Admins
- name: Active Directory — join Windows member servers to the domain
  hosts: windows-cluster
  gather_facts: false
  vars:
    ad_domain_name: globalfinancial.local
    ad_admin_password: Pa$$w0rd
    ad_dc_ip: 10.10.10.3
  roles:
    - name: ansible-role-user-access-windows
      user_access_username: localadmin
      user_access_password: Password123!
      user_access_rdp: True
      user_access_admin: True
  tasks:
    - name: Point DNS at the domain controller on all adapters
      ansible.windows.win_dns_client:
        adapter_names: '*'
        dns_servers:
          - '{{ ad_dc_ip }}'
    - name: Join host to the AD domain
      microsoft.ad.membership:
        dns_domain_name: '{{ ad_domain_name }}'
        domain_admin_user: Administrator@{{ ad_domain_name }}
        domain_admin_password: '{{ ad_admin_password }}'
        state: domain
        reboot: true
- name: Deploy lab verification scripts to Linux nodes
  hosts: linux-nodes
  become: true
  tasks:
    - name: Ensure /opt/scripts exists
      ansible.builtin.file:
        path: /opt/scripts
        state: directory
        mode: '0755'
    - name: Deploy Verify-LabA1.sh to LIN1
      when: inventory_hostname == 'lin1'
      ansible.builtin.copy:
        src: files/Verify-LabA1.sh
        dest: /opt/scripts/Verify-LabA1.sh
        mode: '0750'
    - name: Deploy Verify-LabB1.sh to LIN4
      when: inventory_hostname == 'lin4'
      ansible.builtin.copy:
        src: files/Verify-LabB1.sh
        dest: /opt/scripts/Verify-LabB1.sh
        mode: '0750'
    - name: Deploy Verify-LabC1.sh to LIN4
      when: inventory_hostname == 'lin4'
      ansible.builtin.copy:
        src: files/Verify-LabC1.sh
        dest: /opt/scripts/Verify-LabC1.sh
        mode: '0750'
    - name: Deploy Verify-LabD1.sh to LIN4
      when: inventory_hostname == 'lin4'
      ansible.builtin.copy:
        src: files/Verify-LabD1.sh
        dest: /opt/scripts/Verify-LabD1.sh
        mode: '0750'

- name: Configure user on linux nodes
  hosts: linux-nodes
  become: true
  roles:
    - name: ansible-role-user-access
      user_access_username: localuser
      user_access_password: Password123!
      user_access_sudo: True
