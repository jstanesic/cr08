- name: Populate /etc/hosts so lin1 and lin2 resolve each other on the cluster network
  hosts: linux-ha
  become: true
  vars:
    linux_ha_cluster_hosts:
      - name: lin1
        ip: 10.10.20.6
      - name: lin2
        ip: 10.10.20.7
  tasks:
    - name: Add cluster-network host records
      loop: '{{ linux_ha_cluster_hosts }}'
      loop_control:
        label: '{{ item.name }}'
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^\S+\s+{{ item.name }}$'
        line: '{{ item.ip }} {{ item.name }}'
- name: Shared storage — file-backed iSCSI targets for the WSFC shared disks
  hosts: storage-nodes
  become: true
  vars:
    iscsi_base_iqn: iqn.2026-04.local.globalfinancial
    iscsi_image_dir: /var/lib/iscsi_disks
    # quorum/data1 are presented read-write to the WSFC nodes (srv01/srv02):
    #   quorum = cluster witness disk (small); data1 = clustered data volume.
    # data2 is presented read-write to the Linux Pacemaker nodes (lin1/lin2):
    #   shared MySQL data volume, protected by fence_scsi (SCSI-3 PR) STONITH.
    iscsi_disks:
      - name: quorum
        size: 1G
      - name: data1
        size: 10G
      - name: data2
        size: 10G
  tasks:
    - name: Install targetcli
      ansible.builtin.package:
        name: targetcli-fb
        update_cache: yes
        state: present
    - name: Ensure the SCSI-3 PR (APTPL) metadata directory exists
      ansible.builtin.file:
        path: /etc/rtslib-fb-target/pr
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Ensure the LIO target service is enabled and running
      ansible.builtin.service:
        name: rtslib-fb-targetctl
        enabled: true
        state: started
    - name: Ensure the backing-image directory exists
      ansible.builtin.file:
        path: '{{ iscsi_image_dir }}'
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Create a file-backed backstore for each shared disk
      loop: '{{ iscsi_disks }}'
      loop_control:
        label: '{{ item.name }}'
      register: iscsi_bs
      failed_when:
        - iscsi_bs.rc != 0
        - "'exists' not in (iscsi_bs.stderr | default('')) + (iscsi_bs.stdout | default(''))"
      changed_when: iscsi_bs.rc == 0
      notify: Save targetcli configuration
      ansible.builtin.command: >-
        targetcli /backstores/fileio create name={{ item.name }}
        file_or_dev={{ iscsi_image_dir }}/{{ item.name }}.img size={{ item.size }}
    - name: Create an iSCSI target for each shared disk
      loop: '{{ iscsi_disks }}'
      loop_control:
        label: '{{ item.name }}'
      register: iscsi_tgt
      failed_when:
        - iscsi_tgt.rc != 0
        - "'exists' not in (iscsi_tgt.stderr | default('')) + (iscsi_tgt.stdout | default(''))"
      changed_when: iscsi_tgt.rc == 0
      notify: Save targetcli configuration
      ansible.builtin.command: targetcli /iscsi create {{ iscsi_base_iqn }}:{{ item.name }}
    - name: Map LUN 0 of each target to its backstore
      loop: '{{ iscsi_disks }}'
      loop_control:
        label: '{{ item.name }}'
      register: iscsi_lun
      failed_when:
        - iscsi_lun.rc != 0
        - "'exists' not in (iscsi_lun.stderr | default('')) + (iscsi_lun.stdout | default(''))"
      changed_when: iscsi_lun.rc == 0
      notify: Save targetcli configuration
      ansible.builtin.command: >-
        targetcli /iscsi/{{ iscsi_base_iqn }}:{{ item.name }}/tpg1/luns create
        /backstores/fileio/{{ item.name }} 0
    - name: Allow both WSFC initiators to access TPG 1 of each target
      loop: '{{ iscsi_disks }}'
      loop_control:
        label: '{{ item.name }}'
      register: iscsi_tpg
      changed_when: "'is now' in (iscsi_tpg.stdout | default(''))"
      notify: Save targetcli configuration
      ansible.builtin.command: >-
        targetcli /iscsi/{{ iscsi_base_iqn }}:{{ item.name }}/tpg1 set attribute
        authentication=0 generate_node_acls=1 demo_mode_write_protect=0
  handlers:
    - name: Save targetcli configuration
      ansible.builtin.command: targetcli saveconfig

- name: Observability — pre-stage Loki + Grafana Docker Compose stack on LIN4
  hosts: lin4
  become: true
  tasks:
    - name: Install Docker and the Compose plugin
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        update_cache: true
        state: present
    - name: Ensure the Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started
    - name: Add localuser to the docker group
      ansible.builtin.user:
        name: localuser
        groups: docker
        append: true
    - name: Ensure the observability directories exist
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        mode: '0755'
      loop:
        - /opt/observability
        - /opt/observability/loki-config
    - name: Write the Loki config
      ansible.builtin.copy:
        dest: /opt/observability/loki-config/config.yml
        mode: '0644'
        content: |
          auth_enabled: false

          server:
            http_listen_port: 3100

          common:
            path_prefix: /loki
            storage:
              filesystem:
                chunks_directory: /loki/chunks
                rules_directory: /loki/rules
            replication_factor: 1
            ring:
              kvstore:
                store: inmemory

          schema_config:
            configs:
              - from: 2024-01-01
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
    - name: Write the docker-compose.yml
      ansible.builtin.copy:
        dest: /opt/observability/docker-compose.yml
        mode: '0644'
        content: |
          services:
            loki:
              image: grafana/loki:latest
              container_name: loki
              ports:
                - "3100:3100"
              volumes:
                - ./loki-config/config.yml:/etc/loki/config.yml
                - loki-data:/loki
              command: -config.file=/etc/loki/config.yml
              restart: unless-stopped

            grafana:
              image: grafana/grafana:latest
              container_name: grafana
              ports:
                - "3000:3000"
              volumes:
                - grafana-data:/var/lib/grafana
              restart: unless-stopped

          volumes:
            loki-data:
            grafana-data:
